<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel ADMIN - Productos</title>
</head>
<body>

    <h1>PANEL ADMIN - MI TIENDA</h1>

    <p><a href="/vista/home">Home (catálogo público)</a> | <a href="/vista/formlogin">Login</a></p>

    <p id="infoTienda"></p>

    <div id="formAdmin" style="display:none">
        <h2>Agregar producto</h2>
        <form id="formProducto" th:object="${ProductoDTO}">
            <fieldset>
                <input type="text" id="nombre" placeholder="nombre" th:field="*{nombre}">
                <input type="number" id="precio" placeholder="precio" th:field="*{precio}">
                <input type="number" id="stock" placeholder="stock" th:field="*{stock}">
                <button type="submit">Guardar</button>
            </fieldset>
        </form>
    </div>

    <p id="mensaje"></p>

    <h2>Productos de mi tienda</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody id="listaProductos">
            <tr><td colspan="3">Cargando...</td></tr>
        </tbody>
    </table>

    <script>
        function authHeaders() {
            const token = localStorage.getItem("token");
            return token ? { "Authorization": "Bearer " + token } : {};
        }

        async function cargarPanelAdmin() {
            const token = localStorage.getItem("token");
            if (!token) {
                document.getElementById("mensaje").textContent = "Solo ADMIN. Inicia sesión.";
                document.getElementById("listaProductos").innerHTML = "<tr><td colspan='3'>Sin acceso</td></tr>";
                return;
            }

            const check = await fetch("/productos/check-admin", { headers: authHeaders() });
            if (!check.ok) {
                document.getElementById("mensaje").textContent = "Solo usuarios ADMIN pueden usar este panel";
                document.getElementById("listaProductos").innerHTML = "<tr><td colspan='3'>Sin acceso</td></tr>";
                return;
            }

            document.getElementById("formAdmin").style.display = "block";

            const tiendaResp = await fetch("/tienda/mi-tienda", { headers: authHeaders() });
            if (tiendaResp.ok) {
                const tienda = await tiendaResp.json();
                document.getElementById("infoTienda").textContent =
                    "Tu tienda: " + tienda.nombre + " (id: " + tienda.tiendaId + ")";
            }

            const prodResp = await fetch("/productos/mi-tienda", { headers: authHeaders() });
            const tbody = document.getElementById("listaProductos");
            if (!prodResp.ok) {
                tbody.innerHTML = "<tr><td colspan='3'>No se pudieron cargar productos</td></tr>";
                return;
            }

            const productos = await prodResp.json();
            if (productos.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>No hay productos en tu tienda</td></tr>";
                return;
            }

            tbody.innerHTML = productos.map(function (p) {
                return "<tr><td>" + p.nombre + "</td><td>" + p.precio + "</td><td>" + p.stock + "</td></tr>";
            }).join("");
        }

        cargarPanelAdmin();

        document.getElementById("formProducto").addEventListener("submit", async function (e) {
            e.preventDefault();

            const token = localStorage.getItem("token");
            if (!token) {
                document.getElementById("mensaje").textContent = "Debes iniciar sesión primero";
                return;
            }

            const respuesta = await fetch("/productos/guardar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    nombre: document.getElementById("nombre").value,
                    precio: parseFloat(document.getElementById("precio").value),
                    stock: parseInt(document.getElementById("stock").value, 10)
                })
            });

            if (respuesta.ok) {
                document.getElementById("mensaje").textContent = "Producto guardado";
                document.getElementById("formProducto").reset();
                cargarPanelAdmin();
            } else {
                document.getElementById("mensaje").textContent = "Error al guardar";
            }
        });
    </script>

</body>
</html>
