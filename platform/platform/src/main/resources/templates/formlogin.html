<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MypesPlatform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar">
        <a href="/vista/home" class="navbar-brand">MypesPlatform</a>
        <div class="navbar-links">
            <a href="/vista/home">Volver</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            <form id="formLogin" th:object="${loginRequest}">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Tu usuario" th:field="*{username}" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" th:field="*{password}" required>
                </div>
                <button type="submit" class="mt-4">Ingresar</button>
                <p id="mensaje" class="text-error text-center"></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async function (e) {
            e.preventDefault();

            const btn = this.querySelector('button');
            btn.textContent = "Cargando...";
            btn.disabled = true;

            const respuesta = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            if (!respuesta.ok) {
                document.getElementById("mensaje").textContent = "Credenciales incorrectas o error.";
                btn.textContent = "Ingresar";
                btn.disabled = false;
                return;
            }

            const data = await respuesta.json();
            localStorage.setItem("token", data.token);

            const checkAdmin = await fetch("/productos/check-admin", {
                headers: { "Authorization": "Bearer " + data.token }
            });

            if (checkAdmin.ok) {
                window.location.href = "/vista/agregarProducto";
            } else {
                window.location.href = "/vista/home";
            }
        });
    </script>
</body>
</html>
