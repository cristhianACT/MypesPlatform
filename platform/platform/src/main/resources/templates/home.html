<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Home - MypesPlatform</title>
    <!-- CSS vinculado -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <nav class="navbar">
        <a href="/vista/home" class="navbar-brand">MypesPlatform</a>
        <div class="navbar-links">
            <a href="/vista/formlogin" class="btn">Login</a>
            <a href="/vista/agregarProducto" class="btn">Panel ADMIN</a>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">

            <aside style="flex: 1; min-width: 250px; max-width: 300px;">
                <h2>Tiendas</h2>
                <div class="card" style="padding: 0;">
                    <ul class="list-simple">
                        <li th:each="t : ${tiendas}">
                            <a th:href="@{/vista/tienda/{id}(id=${t.tiendaId})}" th:text="${t.nombre}"></a>
                        </li>
                        <li th:if="${#lists.isEmpty(tiendas)}">No hay tiendas disponibles</li>
                    </ul>
                </div>
            </aside>

            <main style="flex: 3; min-width: 300px;">
                <h2>Productos Recientes</h2>
                <div class="products-grid">
                    <div class="card" th:each="p : ${productos}">
                        <div class="card-title" th:text="${p.nombre}"></div>
                        <div class="card-price" th:text="'S/ ' + ${p.precio}"></div>
                        <div class="card-stock" th:text="'Stock: ' + ${p.stock}"></div>
                        <div class="card-footer" th:if="${p.tiendaId != null}">
                            Vendido por: <a th:href="@{/vista/tienda/{id}(id=${p.tiendaId})}"
                                th:text="'Tienda #' + ${p.tiendaId}"></a>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(productos)}" style="grid-column: 1/-1;">
                        <p>No hay productos disponibles.</p>
                    </div>
                </div>
            </main>

        </div>
    </div>

</body>

</html>
